<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Land (Fractal Cartoon) — 本地复刻</title>
<!--
  本地复刻自 Shadertoy: https://www.shadertoy.com/view/XsBXWt
  Shader: "Fractal Cartoon" by Kali (Nyan Cat 部分来自 mu6k, https://www.shadertoy.com/view/4dXGWH)
  Shadertoy 平台条款:除非作者另行声明,上传的 shader 以 MIT 许可证发布。
  双击本文件即可离线运行;鼠标拖动旋转视角,空格暂停。
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #c { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #hud {
    position: fixed; left: 10px; top: 10px; color: #fff; font: 12px/1.6 monospace;
    text-shadow: 0 1px 2px #000; user-select: none; pointer-events: none; opacity: .85;
  }
  #err { position: fixed; inset: 0; display: none; overflow: auto; padding: 24px;
         background: #111; color: #f66; font: 13px/1.5 monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<pre id="err"></pre>

<!-- ============ shader 源码(与 Shadertoy XsBXWt 一致,MIT License) ============ -->
<script id="fs_image" type="x-shader/x-fragment">// "Fractal Cartoon" - former "DE edge detection" by Kali

// There are no lights and no AO, only color by normals and dark edges.

// update: Nyan Cat cameo, thanks to code from mu6k: https://www.shadertoy.com/view/4dXGWH


//#define SHOWONLYEDGES
#define NYAN 
#define WAVES
#define BORDER

#define RAY_STEPS 150

#define BRIGHTNESS 1.2
#define GAMMA 1.4
#define SATURATION .65


#define detail .001
#define t iTime*.5


const vec3 origin=vec3(-1.,.7,0.);
float det=0.0;


// 2D rotation function
mat2 rot(float a) {
	return mat2(cos(a),sin(a),-sin(a),cos(a));	
}

// "Amazing Surface" fractal
vec4 formula(vec4 p) {
		p.xz = abs(p.xz+1.)-abs(p.xz-1.)-p.xz;
		p.y-=.25;
		p.xy*=rot(radians(35.));
		p=p*2./clamp(dot(p.xyz,p.xyz),.2,1.);
	return p;
}

// Distance function
float de(vec3 pos) {
#ifdef WAVES
	pos.y+=sin(pos.z-t*6.)*.15; //waves!
#endif
	float hid=0.;
	vec3 tpos=pos;
	tpos.z=abs(3.-mod(tpos.z,6.));
	vec4 p=vec4(tpos,1.);
	for (int i=0; i<4; i++) {p=formula(p);}
	float fr=(length(max(vec2(0.),p.yz-1.5))-1.)/p.w;
	float ro=max(abs(pos.x+1.)-.3,pos.y-.35);
		  ro=max(ro,-max(abs(pos.x+1.)-.1,pos.y-.5));
	pos.z=abs(.25-mod(pos.z,.5));
		  ro=max(ro,-max(abs(pos.z)-.2,pos.y-.3));
		  ro=max(ro,-max(abs(pos.z)-.01,-pos.y+.32));
	float d=min(fr,ro);
	return d;
}


// Camera path
vec3 path(float ti) {
	ti*=1.5;
	vec3  p=vec3(sin(ti),(1.-sin(ti*2.))*.5,-ti*5.)*.5;
	return p;
}

// Calc normals, and here is edge detection, set to variable "edge"

float edge=0.;
vec3 normal(vec3 p) { 
	vec3 e = vec3(0.0,det*5.,0.0);

	float d1=de(p-e.yxx),d2=de(p+e.yxx);
	float d3=de(p-e.xyx),d4=de(p+e.xyx);
	float d5=de(p-e.xxy),d6=de(p+e.xxy);
	float d=de(p);
	edge=abs(d-0.5*(d2+d1))+abs(d-0.5*(d4+d3))+abs(d-0.5*(d6+d5));//edge finder
	edge=min(1.,pow(edge,.55)*15.);
	return normalize(vec3(d1-d2,d3-d4,d5-d6));
}


// Used Nyan Cat code by mu6k, with some mods

vec4 rainbow(vec2 p)
{
	float q = max(p.x,-0.1);
	float s = sin(p.x*7.0+t*70.0)*0.08;
	p.y+=s;
	p.y*=1.1;
	
	vec4 c;
	if (p.x>0.0) c=vec4(0,0,0,0); else
	if (0.0/6.0<p.y&&p.y<1.0/6.0) c= vec4(255,43,14,255)/255.0; else
	if (1.0/6.0<p.y&&p.y<2.0/6.0) c= vec4(255,168,6,255)/255.0; else
	if (2.0/6.0<p.y&&p.y<3.0/6.0) c= vec4(255,244,0,255)/255.0; else
	if (3.0/6.0<p.y&&p.y<4.0/6.0) c= vec4(51,234,5,255)/255.0; else
	if (4.0/6.0<p.y&&p.y<5.0/6.0) c= vec4(8,163,255,255)/255.0; else
	if (5.0/6.0<p.y&&p.y<6.0/6.0) c= vec4(122,85,255,255)/255.0; else
	if (abs(p.y)-.05<0.0001) c=vec4(0.,0.,0.,1.); else
	if (abs(p.y-1.)-.05<0.0001) c=vec4(0.,0.,0.,1.); else
		c=vec4(0,0,0,0);
	c.a*=.8-min(.8,abs(p.x*.08));
	c.xyz=mix(c.xyz,vec3(length(c.xyz)),.15);
	return c;
}

vec4 nyan(vec2 p)
{
	vec2 uv = p*vec2(0.4,1.0);
	float ns=3.0;
	float nt = iTime*ns; nt-=mod(nt,240.0/256.0/6.0); nt = mod(nt,240.0/256.0);
	float ny = mod(iTime*ns,1.0); ny-=mod(ny,0.75); ny*=-0.05;
	vec4 color = texture(iChannel1,vec2(uv.x/3.0+210.0/256.0-nt+0.05,1.-.5+uv.y+ny));
	if (uv.x<-0.3) color.a = 0.0;
	if (uv.x>0.2) color.a=0.0;
	if (uv.y>.3) color.a=0.0;
	if (uv.y<-.3) color.a=0.0;
	return color;
}


// Raymarching and 2D graphics

vec3 raymarch(in vec3 from, in vec3 dir) 

{
	edge=0.;
	vec3 p, norm;
	float d=100.;
	float totdist=0.;
	for (int i=0; i<RAY_STEPS; i++) {
		if (d>det && totdist<25.0) {
			p=from+totdist*dir;
			d=de(p);
			det=detail*exp(.13*totdist);
			totdist+=d; 
		}
	}
	vec3 col=vec3(0.);
	p-=(det-d)*dir;
	norm=normal(p);
#ifdef SHOWONLYEDGES
	col=1.-vec3(edge); // show wireframe version
#else
	col=(1.-abs(norm))*max(0.,1.-edge*.8); // set normal as color with dark edges
#endif		
	totdist=clamp(totdist,0.,26.);
	dir.y-=.02;
	float sunsize=7.-max(0.,texture(iChannel0,vec2(.6,.2)).x)*5.; // responsive sun size
	float an=atan(dir.x,dir.y)+iTime*1.5; // angle for drawing and rotating sun
	float s=pow(clamp(1.0-length(dir.xy)*sunsize-abs(.2-mod(an,.4)),0.,1.),.1); // sun
	float sb=pow(clamp(1.0-length(dir.xy)*(sunsize-.2)-abs(.2-mod(an,.4)),0.,1.),.1); // sun border
	float sg=pow(clamp(1.0-length(dir.xy)*(sunsize-4.5)-.5*abs(.2-mod(an,.4)),0.,1.),3.); // sun rays
	float y=mix(.45,1.2,pow(smoothstep(0.,1.,.75-dir.y),2.))*(1.-sb*.5); // gradient sky
	
	// set up background with sky and sun
	vec3 backg=vec3(0.5,0.,1.)*((1.-s)*(1.-sg)*y+(1.-sb)*sg*vec3(1.,.8,0.15)*3.);
		 backg+=vec3(1.,.9,.1)*s;
		 backg=max(backg,sg*vec3(1.,.9,.5));
	
	col=mix(vec3(1.,.9,.3),col,exp(-.004*totdist*totdist));// distant fading to sun color
	if (totdist>25.) col=backg; // hit background
	col=pow(col,vec3(GAMMA))*BRIGHTNESS;
	col=mix(vec3(length(col)),col,SATURATION);
#ifdef SHOWONLYEDGES
	col=1.-vec3(length(col));
#else
	col*=vec3(1.,.9,.85);
#ifdef NYAN
	dir.yx*=rot(dir.x);
	vec2 ncatpos=(dir.xy+vec2(-3.+mod(-t,6.),-.27));
	vec4 ncat=nyan(ncatpos*5.);
	vec4 rain=rainbow(ncatpos*10.+vec2(.8,.5));
	if (totdist>8.) col=mix(col,max(vec3(.2),rain.xyz),rain.a*.9);
	if (totdist>8.) col=mix(col,max(vec3(.2),ncat.xyz),ncat.a*.9);
#endif
#endif
	return col;
}

// get camera position
vec3 move(inout vec3 dir) {
	vec3 go=path(t);
	vec3 adv=path(t+.7);
	float hd=de(adv);
	vec3 advec=normalize(adv-go);
	float an=adv.x-go.x; an*=min(1.,abs(adv.z-go.z))*sign(adv.z-go.z)*.7;
	dir.xy*=mat2(cos(an),sin(an),-sin(an),cos(an));
    an=advec.y*1.7;
	dir.yz*=mat2(cos(an),sin(an),-sin(an),cos(an));
	an=atan(advec.x,advec.z);
	dir.xz*=mat2(cos(an),sin(an),-sin(an),cos(an));
	return go;
}

void mainImage( out vec4 fragColor, in vec2 fragCoord )
{
	vec2 uv = fragCoord.xy / iResolution.xy*2.-1.;
	vec2 oriuv=uv;
	uv.y*=iResolution.y/iResolution.x;
	vec2 mouse=(iMouse.xy/iResolution.xy-.5)*3.;
	if (iMouse.z<1.) mouse=vec2(0.,-0.05);
	float fov=.9-max(0.,.7-iTime*.3);
	vec3 dir=normalize(vec3(uv*fov,1.));
	dir.yz*=rot(mouse.y);
	dir.xz*=rot(mouse.x);
	vec3 from=origin+move(dir);
	vec3 color=raymarch(from,dir); 
	#ifdef BORDER
	color=mix(vec3(0.),color,pow(max(0.,.95-length(oriuv*oriuv*oriuv*vec2(1.05,1.1))),.3));
	#endif
	fragColor = vec4(color,1.);
}</script>

<script>
"use strict";
(() => {
  const canvas = document.getElementById("c");
  const hud = document.getElementById("hud");
  const errBox = document.getElementById("err");
  const fragSrc = document.getElementById("fs_image").textContent;

  const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false })
          || canvas.getContext("webgl",  { antialias: false, preserveDrawingBuffer: false });
  if (!gl) { showErr("此浏览器不支持 WebGL。"); return; }
  const isGL2 = (typeof WebGL2RenderingContext !== "undefined") && (gl instanceof WebGL2RenderingContext);

  // ---- 组装 shader:补上 Shadertoy 环境头/尾 ----
  function buildFragmentSource() {
    let src = fragSrc;
    const head = [];
    if (isGL2) {
      head.push("#version 300 es");
    } else {
      // WebGL1 回退:texture( -> texture2D(
      src = src.replace(/\btexture\s*\(/g, "texture2D(");
    }
    head.push(
      "precision highp float;",
      "uniform vec3  iResolution;",
      "uniform float iTime;",
      "uniform float iTimeDelta;",
      "uniform float iFrameRate;",
      "uniform int   iFrame;",
      "uniform vec4  iMouse;",
      "uniform vec4  iDate;",
      "uniform float iSampleRate;",
      "uniform vec3  iChannelResolution[4];",
      "uniform float iChannelTime[4];",
      "uniform sampler2D iChannel0, iChannel1, iChannel2, iChannel3;",
      ""
    );
    if (isGL2) head.push("#define texture2D texture", "out vec4 outColor;", "");
    const tail = isGL2
      ? "void main(){ vec4 c=vec4(0.); mainImage(c, gl_FragCoord.xy); outColor=c; }"
      : "void main(){ vec4 c=vec4(0.); mainImage(c, gl_FragCoord.xy); gl_FragColor=c; }";
    return head.join("\n") + "\n" + src + "\n" + tail;
  }

  function compile(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error("Shader 编译失败:\n" + gl.getShaderInfoLog(s));
    }
    return s;
  }

  let program;
  const vsSrc = isGL2
    ? "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"
    : "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
  try {
    program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, buildFragmentSource()));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error("Program 链接失败:\n" + gl.getProgramInfoLog(program));
    }
  } catch (e) { showErr(e.message); return; }
  gl.useProgram(program);

  // 全屏两个三角形
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const locP = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(locP);
  gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

  // ---- 纹理通道 ----
  // iChannel0:原作品绑了音频(shader 4sXGzn);iChannel1:Nyan Cat 贴图(nyanRgb.png)。
  // 该贴图所在的 media.shadertoy.com 域名已失效,当前官网同样是加载不到的状态,
  // 因此这里默认用 1x1 黑色纹理替代(与官网现状一致)。
  // 如想启用 Nyan Cat:把 256x256 的 nyanRgb.png 放到本目录并命名为 nyan.png,刷新即可。
  function blackTexture() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    return t;
  }
  function loadImageTexture(url) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    };
    img.src = url;
    return t;
  }
  const channels = [blackTexture(), blackTexture(), blackTexture(), blackTexture()];
  // 同目录存在 nyan.png 时自动启用
  fetch("nyan.png", { method: "HEAD" }).then(r => { if (r.ok) channels[1] = loadImageTexture("nyan.png"); }).catch(() => {});

  // ---- uniforms ----
  const U = {};
  for (const n of ["iResolution","iTime","iTimeDelta","iFrameRate","iFrame","iMouse","iDate","iSampleRate"]) {
    U[n] = gl.getUniformLocation(program, n);
  }
  U.iChannelResolution = gl.getUniformLocation(program, "iChannelResolution");
  U.iChannelTime = gl.getUniformLocation(program, "iChannelTime");
  for (let i = 0; i < 4; i++) U["iChannel" + i] = gl.getUniformLocation(program, "iChannel" + i);

  // ---- 状态 ----
  const mouse = { x: 0, y: 0, z: 0, w: 0 };
  let dragging = false;
  canvas.addEventListener("mousedown", e => {
    dragging = true;
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = r.height - (e.clientY - r.top); // Shadertoy 左下角原点
    mouse.z = mouse.x; mouse.w = mouse.y;
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = r.height - (e.clientY - r.top);
  });
  window.addEventListener("mouseup", () => { dragging = false; mouse.z = 0; mouse.w = 0; });
  canvas.addEventListener("touchstart", e => {
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    dragging = true;
    mouse.x = t.clientX - r.left; mouse.y = r.height - (t.clientY - r.top);
    mouse.z = mouse.x; mouse.w = mouse.y;
  }, { passive: true });
  canvas.addEventListener("touchmove", e => {
    if (!dragging) return;
    const t = e.touches[0], r = canvas.getBoundingClientRect();
    mouse.x = t.clientX - r.left; mouse.y = r.height - (t.clientY - r.top);
  }, { passive: true });
  window.addEventListener("touchend", () => { dragging = false; mouse.z = 0; mouse.w = 0; });

  let paused = false;
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); paused = !paused; }
  });

  // 尺寸(限制 DPR 上限 2,防止高 分辨率下 raymarching 过重)
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(canvas.clientWidth * dpr);
    const h = Math.floor(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  window.addEventListener("resize", resize);

  function showErr(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
  }

  // ---- 主循环 ----
  const t0 = performance.now();
  let lastT = 0, frame = 0, lastFrameTime = t0;

  function render(now) {
    resize();
    const time = paused ? lastT : (now - t0) / 1000;
    const dt = paused ? 0 : Math.min((now - lastFrameTime) / 1000, 0.1);
    lastT = time;
    lastFrameTime = now;
    frame++;

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(U.iResolution, canvas.width, canvas.height, 1);
    gl.uniform1f(U.iTime, time);
    gl.uniform1f(U.iTimeDelta, dt);
    gl.uniform1f(U.iFrameRate, frame > 1 ? 1000 / (now - lastFrameTime + dt * 1000) : 0);
    gl.uniform1i(U.iFrame, frame);
    gl.uniform4f(U.iMouse, mouse.x, mouse.y, mouse.z, mouse.w);
    const d = new Date();
    gl.uniform4f(U.iDate, d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000);
    gl.uniform1f(U.iSampleRate, 44100);
    // 通道分辨率/时间(黑纹理按 1x1 处理;与官网缺失资源时行为一致)
    if (U.iChannelResolution) gl.uniform3f(U.iChannelResolution, 1, 1, 1);
    if (U.iChannelTime) gl.uniform1f(U.iChannelTime, time);

    for (let i = 0; i < 4; i++) {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, channels[i]);
      if (U["iChannel" + i]) gl.uniform1i(U["iChannel" + i], i);
    }

    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (frame % 15 === 0) {
      hud.textContent = `Fractal Cartoon (Kali) — 本地复刻  |  ${canvas.width}x${canvas.height}  |  ${time.toFixed(1)}s  |  空格暂停${paused ? " [已暂停]" : ""}`;
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
